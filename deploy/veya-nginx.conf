# veya.aiinote.com — Nginx Configuration
# Routes: /api/* → backend:8765, /dashboard → SPA:9998, / → backend:8765 (SPA)

upstream veya_backend { server 127.0.0.1:8765; }
upstream veya_spa     { server 127.0.0.1:9998; }

server {
    listen 80;
    server_name veya.aiinote.com;

    # Security
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ── API Backend ──────────────────────────────
    location /api/ {
        proxy_pass http://veya_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # ── SSE Streaming ────────────────────────────
    location /api/v1/agent/stream {
        proxy_pass http://veya_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
        proxy_set_header Host $host;
    }

    # ── Mobile PWA ───────────────────────────────
    location /mobile/ {
        proxy_pass http://veya_backend;
        proxy_set_header Host $host;
    }

    # ── IM Webhooks ──────────────────────────────
    location /im/ {
        proxy_pass http://veya_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── WebSocket ────────────────────────────────
    location /ws {
        proxy_pass http://veya_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # ── SPA Dashboard ────────────────────────────
    location /dashboard {
        rewrite ^/dashboard/?(.*) /$1 break;
        proxy_pass http://veya_spa;
        proxy_set_header Host $host;
    }
    location /static/ {
        proxy_pass http://veya_spa;
        proxy_set_header Host $host;
    }

    # ── SPA (served by backend from veya/web) ──────
    location / {
        proxy_pass http://veya_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    client_max_body_size 50M;
}
