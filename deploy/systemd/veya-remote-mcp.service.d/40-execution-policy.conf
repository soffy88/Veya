[Service]

# Keep host project repositories writable for the explicitly bound Veya
# workspace.  The remote WorkspacePolicy remains the authorization boundary.
ProtectSystem=full
ProtectHome=read-only

ReadWritePaths=/data/soffy/projects
ReadWritePaths=/home/soffy/.veya
ReadWritePaths=/home/soffy/.cache
ReadWritePaths=/home/soffy/.local

DynamicUser=no
PrivateUsers=no
