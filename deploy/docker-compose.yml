# veya Production Docker Compose
# Deploy: docker compose up -d --build
# Domain: veya.aiinote.com
name: veya
version: '3.8'

services:
  # ── FastAPI Backend (veya server) ───────────────────
  backend:
    image: veya-backend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: veya-backend
    ports:
      - "8767:8765"      # gateway 通道 (VEYA_GATEWAY)
      - "9120:8765"      # legacy 通道 (VEYA_LEGACY, 前端主脑/工具代理)
      - "8768:8768"      # hicode serve (独立 oservi: submit/events/cancel/approve/plan/goal)
    command: ["sh", "/app/hicode-entrypoint.sh"]
    environment:
      - VEYA_LLM_PROVIDER=${VEYA_LLM_PROVIDER:-veya1.2}
      # Production durable execution is configured in the root .env. If it is
      # enabled without PostgreSQL, startup fails closed before any claim.
      - VEYA_DURABLE_EXECUTION=${VEYA_DURABLE_EXECUTION:-0}
      - VEYA_EXECUTION_DATABASE_URL=${VEYA_EXECUTION_DATABASE_URL:-}
      - VEYA_EXECUTION_PRODUCTION=${VEYA_EXECUTION_PRODUCTION:-1}
      - VEYA_EXECUTION_LEASE_TTL_S=${VEYA_EXECUTION_LEASE_TTL_S:-30}
      - VEYA_EXECUTION_HEARTBEAT_INTERVAL_S=${VEYA_EXECUTION_HEARTBEAT_INTERVAL_S:-10}
      - VEYA_EXECUTION_RECONCILIATION_INTERVAL_S=${VEYA_EXECUTION_RECONCILIATION_INTERVAL_S:-15}
      - VEYA_EXECUTION_RECONCILIATION_BATCH_SIZE=${VEYA_EXECUTION_RECONCILIATION_BATCH_SIZE:-100}
      - VEYA_EXECUTION_DURABLE_QUEUE_READ=${VEYA_EXECUTION_DURABLE_QUEUE_READ:-0}
      - VEYA_EXECUTION_DURABLE_QUEUE_CLAIM=${VEYA_EXECUTION_DURABLE_QUEUE_CLAIM:-0}
      - VEYA_EXECUTION_LEASE_FENCING=${VEYA_EXECUTION_LEASE_FENCING:-1}
      - VEYA_EXECUTION_SIDE_EFFECT_LEDGER=${VEYA_EXECUTION_SIDE_EFFECT_LEDGER:-0}
      - VEYA_EXECUTION_RECONCILER=${VEYA_EXECUTION_RECONCILER:-0}
      - VEYA_EXECUTION_FINALIZATION_RESUME=${VEYA_EXECUTION_FINALIZATION_RESUME:-0}
      - VEYA_EXECUTION_EVENT_OUTBOX=${VEYA_EXECUTION_EVENT_OUTBOX:-0}
      - VEYA_EXECUTION_SHADOW_COMPARE=${VEYA_EXECUTION_SHADOW_COMPARE:-0}
      - VEYA_EXECUTION_DUAL_RUN_COMPARE=${VEYA_EXECUTION_DUAL_RUN_COMPARE:-0}
      - VEYA_EXECUTION_REMOTE_WORKER_ADAPTER=${VEYA_EXECUTION_REMOTE_WORKER_ADAPTER:-0}
      # Personal Agent Runtime uses the same durable PostgreSQL authority as
      # GoalRun. Flags are persisted per run by the application; defaults are
      # enabled for the production cohort and remain lazy in local/dev.
      - VEYA_MEMORY_V2=${VEYA_MEMORY_V2:-1}
      - VEYA_MEMORY_CANDIDATES=${VEYA_MEMORY_CANDIDATES:-1}
      - VEYA_MEMORY_CONFLICT_DETECTION=${VEYA_MEMORY_CONFLICT_DETECTION:-1}
      - VEYA_SKILL_V2=${VEYA_SKILL_V2:-1}
      - VEYA_SKILL_TEACHING=${VEYA_SKILL_TEACHING:-1}
      - VEYA_SKILL_VERSIONING=${VEYA_SKILL_VERSIONING:-1}
      - VEYA_CONTINUITY_V1=${VEYA_CONTINUITY_V1:-1}
      - VEYA_PERSONAL_CONTEXT_UI=${VEYA_PERSONAL_CONTEXT_UI:-1}
      - VEYA_LONG_TERM_LEARNING=${VEYA_LONG_TERM_LEARNING:-1}
      - VEYA_PERSONAL_AGENT_EVAL=${VEYA_PERSONAL_AGENT_EVAL:-1}
      # Approved Gold benchmark projection; the database/runtime remains the
      # authority, and this file is read-only quality evidence only.
      - VEYA_PERSONAL_AGENT_GOLD_REPORT=${VEYA_PERSONAL_AGENT_GOLD_REPORT:-/repo/evals/personal_agent_gold/results/latest.json}
      # local = process/docker (veya start / 当前单机). hosted = OpenSandbox, 禁止 process.
      - VEYA_SANDBOX_PROFILE=${VEYA_SANDBOX_PROFILE:-local}
      - OPEN_SANDBOX_DOMAIN=${OPEN_SANDBOX_DOMAIN:-}
      - OPEN_SANDBOX_API_KEY=${OPEN_SANDBOX_API_KEY:-}
      - OPEN_SANDBOX_PROTOCOL=${OPEN_SANDBOX_PROTOCOL:-http}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GMI_API_KEY=${GMI_API_KEY:-}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - INFERERA_API_KEY=${INFERERA_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      # dsh (DeepSeek Harness) 走 opencode-go 网关: dsh-llm-deepseek 支持
      # DEEPSEEK_BASE_URL 覆盖官方 endpoint (源码确认, 进程环境变量优先级最高),
      # DeepSeek API 本身是 OpenAI 兼容协议, opencode-go 代理同样兼容, 复用同一
      # 把 opencode key (与 OPENCODE_API_KEY 相同来源, 2026-08-16 接入)。
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://opencode.ai/zen/go/v1}
      - VEYA_PSEUDO_SECRET=${VEYA_PSEUDO_SECRET:-veya-dev-secret}
      - HEVI_JWT_SECRET=${HEVI_JWT_SECRET:-}
      - HEVI_MCP_USER_ID=${HEVI_MCP_USER_ID:-}
      - HEVI_MCP_ENDPOINT=${HEVI_MCP_ENDPOINT:-http://192.168.16.1:8201/mcp/mcp}
      - OD_API_TOKEN=${OD_API_TOKEN:-}
      - OD_DAEMON_URL=${OD_DAEMON_URL:-http://192.168.16.1:17456}
      - VEYA_FRONTIER_ENDPOINT=${VEYA_FRONTIER_ENDPOINT:-http://192.168.16.1:10101/v1}
      # hicode 编码执行器: 状态/工作区进 veya-data volume, 配置目录只读
      - REASONIX_STATE_HOME=/home/soffy/.veya/reasonix-state
      - HICODE_PROXY=1   # 容器内反代: 改 Host 头绕过 opencodex 来源校验
      # Vision Toolkit 路径白名单: 主脑视觉取证可读 /repo (veya 仓库) + 同级项目
      # + hicode 工作区 (像素差分 hicode 产物); 视觉模型走 hicode 反代 (见 oskill)
      - VEYA_VISION_ALLOWED_DIRS=/repo:/home/soffy/projects:/home/soffy/.veya/hicode-workspace
      # 通用文件工具 (list_files/grep/read_file_ast) 额外允许目录: 卷已挂了同级
      # 项目 (见下方 volumes), 但读写根 VEYA_WORKSPACE 只认 /app, 之前主脑评估
      # 兄弟项目(如 hevi)时 list_files/grep 会报 escapes workspace root。
      - VEYA_WORKSPACE_EXTRA_DIRS=/home/soffy/projects
      # hevi MCP 依赖 (argon2/bcrypt/pyotp/qrcode) 临时装容器可写层; 镜像重建后由
      # requirements.txt 提供, 此路径仅容器层存在, 镜像层无则静默跳过
      - PYTHONPATH=/app:/app/services:/app/platform/3O/oprim:/app/platform/3O/oskill:/app/platform/3O/omodul:/app/platform/3O/obase:/app/platform/3O/oservi:/home/soffy/hevi_deps
    volumes:
      - veya-data:/home/soffy/.veya
      # hevi MCP 依赖 (argon2/bcrypt/pyotp/qrcode) — 镜像重建后由 requirements.txt
      # 提供; 当前阶段从宿主 deploy/hevi_deps 挂载 (容器层不可写, 镜像未含)
      - ../deploy/hevi_deps:/home/soffy/hevi_deps:ro
      # tools/ 是镜像 COPY 目录 (无挂载则不实时) — 挂载宿主便于热更适配器
      - ../tools:/app/tools:ro
      - ../veya:/app/veya:ro
      - ../platform:/app/platform:ro
      - ../server:/app/server:ro
      # Execution Runtime core is mounted with server so runtime changes take
      # effect after container recreation without an image rebuild.
      - ../runtime:/app/runtime:ro
      - ../veya_loop:/app/veya_loop:ro
      # 多引擎 CLI (node 生态 + claude 版本) 与凭据目录
      - /home/soffy/.nvm:/home/soffy/.nvm:ro
      - /home/soffy/.local:/home/soffy/.local:ro
      # opencode 数据目录 rw (DB/log 写入); 凭据 auth.json 单独回 ro
      - /home/soffy/.local/share/opencode:/home/soffy/.local/share/opencode:rw
      - /home/soffy/.local/share/opencode/auth.json:/home/soffy/.local/share/opencode/auth.json:ro
      # Open Design daemon (od mcp stdio 客户端依赖)
      - /home/soffy/opendesign:/home/soffy/opendesign:ro
      - /home/soffy/.claude:/home/soffy/.claude:rw
      - /home/soffy/.claude.json:/home/soffy/.claude.json:ro
      - /home/soffy/.codex:/home/soffy/.codex:rw
      - /home/soffy/.pi:/home/soffy/.pi:rw
      - /home/soffy/.grok:/home/soffy/.grok:rw
      - /home/soffy/.opencode:/home/soffy/.opencode:ro
      # skill_hub 技能库 (宿主实时同步, 只读)
      - /home/soffy/.veya/skills:/home/soffy/.veya/skills:ro
      # hicode 编码执行器配置 (容器内 base_url=宿主网关 192.168.16.1:10101)
      # 单文件 ro 挂载 → ~/.reasonix/.env (容器层可写, 启动脚本写入 key)
      - ../deploy/hicode-container/config.toml:/home/soffy/.reasonix/config.toml:ro
      - ../deploy/hicode-entrypoint.sh:/app/hicode-entrypoint.sh:ro
      # Git 面板工作区: 宿主 veya 仓库根 (git status/diff/commit 操作真实仓库)
      - /data/soffy/projects/veya:/repo:rw
      # 宿主同级项目 (hemal/stratum/aegis 等) — 此前完全没挂进容器, 主脑连
      # list_files 都会报 "escapes workspace root"。容器内路径与宿主一致
      # (/home/soffy/projects), 便于按宿主路径直接引用/映射。
      - /data/soffy/projects:/home/soffy/projects:rw
    # Chromium 无头浏览器 /dev/shm 需求 (抓取通道)
    shm_size: "1gb"
    restart: unless-stopped
    networks:
      - veya-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  veya-data:
    name: deploy_veya-data
    external: true

networks:
  veya-net:
    name: veya-net
    driver: bridge
