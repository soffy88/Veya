site_name: Veya
site_description: "Veya — an open agent runtime for persistent, tool-using, verifiable AI (coding is the first application surface, not the final definition)"
site_url: https://github.com/soffy88/Veya
repo_url: https://github.com/soffy88/Veya
repo_name: soffy88/Veya

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            show_source: true
            show_root_heading: true
            show_if_no_docstring: true
            docstring_style: google
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 快速开始: quickstart.md
  - 使用示例: examples.md
  - 故障排查: troubleshooting.md
  - Harness Engineering: HARNESS_ENGINEERING.md
  - P1–P3 实施规格: VEYA_P1_P3_IMPLEMENTATION_SPEC.md
  - 产品路线图: roadmap.md
  - 架构: architecture.md
  - 标杆差距与路线图: BENCHMARK_AND_GAPS.md
  - API 参考:
      - veya.llm (LLM Provider): api/llm.md
      - veya.intent (意图分类): api/intent.md
      - veya.sandbox (沙箱): api/sandbox.md
      - veya.multimodal (多模态): api/multimodal.md
      - veya.obase (3O 基座):
          - 遥测 telemetry: api/obase-telemetry.md
          - 权限 authz: api/obase-authz.md
      - veya.errors (异常): api/errors.md
  - 开发者:
      - 3O 范式检查: dev/3o-checks.md
      - 3O 装配图: dev/veya-3o-assembly.md
      - 插件 SDK: dev/plugins.md
      - Coding Harness Contract: coding/HARNESS_CONTRACT.md
