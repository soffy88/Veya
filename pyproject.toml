[project]
name = "veya"
version = "0.6.0"
description = "veya — open agent runtime for persistent, tool-using, verifiable AI (coding is the first surface, not the final definition)"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.1",
    "aiohttp>=3.14.3",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",  # G17: FastAPI 表单/文件上传支持
    "structlog>=24.0",  # 3O obase 主库 core 依赖(轻量, 装配通道 veya.platform 所需)
    "apscheduler>=3.10,<4",  # Veya Automata: 后台定时/事件调度(Agent OS)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
]
# G17: 按需可选依赖(不默认安装,避免无用依赖膨胀)
interactive = [
    "prompt-toolkit>=3.0.0",  # 增强交互式 CLI(行编辑/补全/历史)
]
settings = [
    "pydantic-settings>=2.0.0",  # 若接入 pydantic 配置管理(现用自研 loader)
]
sandbox = [
    "opensandbox>=0.1.0",  # hosted multi-user execution plane (optional)
]
vision = [
    "pillow>=10.0.0",   # 图像原子操作 (裁剪/切分/差分/主色/报图)
    # vtracer pip 包 0.6.15 在 CPython 3.14 下段错误 → 不装包, 用独立 CLI 二进制
    # (~/.veya/bin/vtracer, 见 docs/ops/TOOLCHAIN_SETUP.md §2.2), 缺失时 PIL 降级
    "httpx>=0.27.0",    # 视觉 LLM 客户端
]
# 2026-08-24 (docs/dev/rfc-07-dependency-hygiene.md): cli/main.py 的 TUI 启动路径
# 已经是 try/except 包住的懒加载 + 失败自动回退 readline loop, textual 不装也不影响
# 任何 server/核心 CLI 路径, 是这轮调研里唯一验证过安全可挪的一个。
tui = [
    "textual>=0.60.0",
]
# 2026-08-24 §2 (docs/dev/rfc-07-dependency-hygiene.md): 用 sys.meta_path find_spec
# 拦截验证过——cli/(veya/veya-headless/veya-simple)完全不 import server.app,
# 这三个包只有真的跑 FastAPI 服务 (server.app) 时才需要 (routes/evolution →
# darwin_evolution → quant_coprocessor, 虽然 quant_coprocessor 自己的 pandas/numpy
# 用法全在沙箱子进程脚本字符串里, 不在主进程 eager import 路径上——真正拉入 numpy
# 的是 server/routes/adversarial.py → 3O omodul/oprim 链, 但那条链本来就要求 3O
# 子库存在, 跟这三个包装不装没关系)。生产 docker 镜像不受影响——deploy/
# requirements.txt 已经独立锁定这六个包的版本, pyproject.toml 这里删减跟
# Dockerfile.backend 的构建结果无关。
quant = [
    "pandas>=2.0",  # Quant Coprocessor: 海量行情数据处理(控制面/数据面分离)
    "numpy>=1.26",  # Quant Coprocessor: 向量化指标计算
    "pyarrow>=15.0",  # Quant Coprocessor: parquet 高速 I/O(pd.read_parquet 引擎)
]
# 2026-08-24 §3 (docs/dev/rfc-07-dependency-hygiene.md): server/app.py 通过
# routes/visualization.py + routes/advanced_visualization.py 对 veya.visualization/
# veya.advanced_visualization 是真 eager import (find_spec 拦截验证过, 直接拉红)。
# 只有跑 server.app (FastAPI 服务) 才需要; CLI 不受影响。
viz = [
    "networkx>=3.6.1",
    "matplotlib>=3.11.1",
    "plotly>=6.9.0",
]
# 跑 server.app (FastAPI 服务, 而不是纯 CLI) 需要上面 quant + viz 两组全装。
server = [
    "veya[quant]",
    "veya[viz]",
]

[project.scripts]
veya = "cli.main:main"
veya-headless = "cli.headless:main"
veya-simple = "cli.simple_cli:main"

# Removed legacy obase/oprim/oskill/omodul/oservi dependencies

# Removed legacy dependency overrides

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
  "venv/",
  ".venv/",
  "__pycache__/",
  "*.pyc",
  ".git/",
  "tests/",
  "*.md",
  "platform/3O/",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = [
  "venv/",
  ".venv/",
  "__pycache__/",
  "*.pyc",
  ".git/",
  "tests/",
  "*.md",
  "platform/3O/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers -v"

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]
# 3O 主库 submodule: 外部 repo 代码, 不在 Veya lint 范围 (主库自带 SELF_CHECK)
extend-exclude = ["platform/3O/**", "platform/3O"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",     # line length handled by formatter
    "B008",     # do not perform function calls in argument defaults (fastapi pattern)
    "B904",     # raise-without-from: existing HTTPException pattern embeds err in detail message
    # Bilingual codebase: Chinese docstrings/comments contain full-width punctuation.
    "RUF001",   # ambiguous unicode in strings
    "RUF002",   # ambiguous unicode in docstrings
    "RUF003",   # ambiguous unicode in comments
]

[tool.ruff.lint.isort]
known-first-party = ["veya", "server", "agents", "tools", "cli", "hooks", "registries", "config", "session", "streaming"]

[tool.ruff.lint.per-file-ignores]
# 独立验证脚本（P4/P5 回归）：先 chdir 到仓库根再 import 项目模块，属有意为之。
"run_*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"   # numpy/plotly stubs 用 3.12 语法;代码 3.11 兼容由独立 AST 检查把关
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_optional = true
disallow_untyped_defs = false    # increment to true over time
disallow_incomplete_defs = false # increment to true over time
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "veya.obase",
    "veya.obase.*",
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["textual.*", "plotly.*", "networkx.*", "matplotlib.*"]
ignore_missing_imports = true

# 真正可选依赖(try/except ImportError 守卫, 缺失时功能降级), 不是核心依赖清单
# 漏项——见 veya/oskill/audio_io.py::list_audio_devices / veya/oprim/vad.py
# (Silero VAD 需要 onnxruntime, 缺失时回落纯 Python 能量检测)。
[[tool.mypy.overrides]]
module = ["sounddevice", "onnxruntime"]
ignore_missing_imports = true

# 3O 子库用 veya.platform.load() 动态挂载到 sys.path, mypy 静态分析看不到这条路径,
# 报 import-not-found 不代表真的缺实现。跟 numpy/plotly 一样按 stub 缺失处理。
[[tool.mypy.overrides]]
module = ["oskill.*", "oservi.*", "oprim.*", "omodul.*", "obase.*"]
ignore_missing_imports = true

# numpy stubs 使用 3.12 语法(PEP 695),在 python_version=3.11 下报 syntax;
# 其类型信息对本项目非关键,整体忽略。
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
ignore_errors = true

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["veya", "server", "agents", "tools"]
omit = [
    "tests/*",
    "**/__pycache__/*",
    "**/.venv/*",
    "venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__",
    "raise NotImplementedError",
    "pass",
]
# Coverage gate: 40% baseline (CI measures the full suite; currently at ~54%).
fail_under = 50   # G8: 58% achieved → gate raised from 40
show_missing = true
