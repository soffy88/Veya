<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>veya — Agent Console</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ── top bar ─────────────────────────────────────────────────── -->
<header id="topbar">
  <div class="brand">
    <span class="logo">⚡</span>
    <span class="name">veya</span>
    <span class="tag">agent console</span>
  </div>

  <div class="spacer"></div>

  <div class="conn" id="conn" title="点击修改后端地址">
    <span class="dot" id="conn-dot"></span>
    <span id="conn-text">connecting…</span>
  </div>

  <div class="model-pick">
    <select id="provider" title="LLM 提供商">
      <option value="dashscope">dashscope</option>
      <option value="anthropic">anthropic</option>
      <option value="openai">openai</option>
    </select>
    <input id="model" placeholder="model (默认)" spellcheck="false">
  </div>

  <button id="btn-new" class="ghost" title="清空当前会话 (⌘/Ctrl+N)">＋ 新会话</button>
</header>

<!-- ── body ────────────────────────────────────────────────────── -->
<main id="layout">

  <!-- session rail -->
  <aside id="rail">
    <div class="rail-head">会话</div>
    <div id="session-list"></div>
    <div class="rail-foot" id="rail-foot"></div>
  </aside>

  <!-- chat column -->
  <section id="chat">
    <div id="log"></div>

    <div id="composer">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="告诉 veya 你想做什么…" spellcheck="false"></textarea>
        <button id="btn-send" class="primary">发送 ↵</button>
      </div>
      <div class="hint">
        <span><kbd>Enter</kbd> 发送</span>
        <span><kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span>
        <span><kbd>Esc</kbd> 停止</span>
        <span class="hint-right" id="hint-status"></span>
      </div>
    </div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
