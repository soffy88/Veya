# Security policy for veya
default_permissions:
  - read_files
  - execute_code
  - network_connect

restricted_permissions:
  - write_files
  - call_external_api
  - shell_execute

audit_enabled: true
log_file: "security_audit.log"

rate_limits:
  api_calls_per_minute: 10
  file_operations_per_minute: 5

whitelist:
  allowed_hosts:
    - "localhost"
    - "127.0.0.1"
    - "::1"
  allowed_paths:
    - "/data/soffy/projects/veya/"
    - "/tmp/"

blacklist:
  forbidden_patterns:
    - "../"
    - "/etc/"
    - "/root/"
    - "eval("
    - "exec("