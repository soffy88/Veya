[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veya-loop"
version = "0.5.0"
description = "Veya Loop Engine / 维亚闭环引擎 — 因果闭环控制基板 (Phase 2/3/4)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Veya Loop Team" }]
keywords = ["causal", "closed-loop", "do-calculus", "bayesian", "audit", "honeypot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]

# 3O 主库元素 (oprim/oskill/omodul/obase) 是独立主数据包 —— 通过自身发行渠道安装,
# 或经 _assembly 装配器挂载 git submodule 路径 (见 README「接线」一节)。
dependencies = [
    "numpy==2.2.6; python_version < '3.14'",
    "numpy==2.5.1; python_version >= '3.14'",
    "networkx==3.6.1",
    "scipy==1.18.0",
]

[project.optional-dependencies]
# [all]: 完整能力面 (求解器 + 数据面)
all = [
    "z3-solver==5.0.0.0",
    "pandas==3.0.5",
]
# 开发/测试
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
]

[project.scripts]
veya-loop = "veya_loop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/veya_loop"]

[tool.hatch.build.targets.sdist]
include = ["src/veya_loop", "README.md", "docs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # pgmpy 上游弃用通知 (主库导入链触发, 与本包无关)
    "ignore:.*StructureScore.*:FutureWarning",
]
