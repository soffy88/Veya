[project]
name = "loop-plane"
version = "0.1.0"
description = "Loop Plane 微服务 — 长程 Goal/Todo/Gate/Quota、因果规划与诊断、硬化干预、审计、可选调度与 Skill 实验"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "pydantic==2.13.4",
    "veya-loop==0.5.0",
    "obase==0.31.0",
    "oprim==3.23.0",
    "oskill==4.14.0",
    "omodul==1.49.0",
    "oservi==1.4.0",
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.3.0", "httpx==0.28.1"]

[tool.uv.sources]
obase = { path = "../../platform/3O/obase" }
oprim = { path = "../../platform/3O/oprim" }
oskill = { path = "../../platform/3O/oskill" }
omodul = { path = "../../platform/3O/omodul" }
oservi = { path = "../../platform/3O/oservi" }
veya-loop = { path = "../../veya_loop" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]
