[project]
name = "loop-plane"
version = "0.1.0"
description = "Loop Plane 微服务 — 长程 Goal/Todo/Gate/Quota、因果规划与诊断、硬化干预、审计、可选调度与 Skill 实验"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "veya-loop>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
