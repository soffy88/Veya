name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (v${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify 3O submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule status --recursive

      - name: Install build tools
        run: |
          python -m pip install --upgrade build
          pip install -e ".[dev,server,tui]"
          pip install -e ./veya_loop
          pip install pytest-cov pgmpy
          pip install mkdocs-material mkdocstrings[python]

      - name: Release preflight — state, safety, migration, coverage
        run: |
          # Keep release's 3O reverse-dependency gate identical to required CI.
          # The broader legacy checker remains a separately tracked baseline and
          # must not make this required release path disagree with main CI.
          python scripts/check_obase_no_reverse_dep.py
          python scripts/check_manifest.py
          python scripts/check_async_contract.py
          python scripts/check_no_direct_io.py . --baseline scripts/baseline_direct_io.txt --quiet
          pytest -q --cov=server.events --cov=server.task_store --cov=server.routes.sessions \
            --cov=server.routes.tasks --cov=server.sse --cov=server.memory_controller \
            --cov=server.capability_model --cov=server.acceptance --cov=server.permission_profiles \
            --cov=server.telemetry --cov=server.trajectory --cov=server.agent_loop_bridge \
            --cov=veya.omodul.agent_loop --cov-fail-under=80 \
            tests/test_acceptance.py tests/test_task_store.py tests/test_sse_disconnect.py \
            tests/test_trajectory.py tests/test_telemetry.py tests/test_memory_controller.py \
            tests/test_memory_canonical_status.py tests/test_permission_profiles.py \
            tests/test_skill_hub_contract.py tests/test_capability_model.py \
            tests/test_unified_session_api.py tests/test_session_routes.py \
            tests/test_legacy_agent_sessions_sync.py tests/test_product_cli.py \
            tests/test_spec_runtime_e2e.py tests/test_runtime_cancel_resume.py \
            tests/test_history_store_migration.py tests/test_feature_flags.py \
            tests/test_sandbox_profiles.py tests/test_canonical_event_model.py \
            tests/test_sse_envelope.py tests/test_agent_loop_bridge_safety.py \
            tests/test_agent_loop_constraints.py tests/test_tool_event_boundary.py \
            tests/test_goal_run_boundary.py tests/test_learning_trajectory_pipeline.py
          mkdocs build --strict

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag $TAG_VERSION != pyproject $PKG_VERSION" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true

      - name: Publish to PyPI (dry-run by default)
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          pip install twine
          if [ -n "$TWINE_PASSWORD" ]; then
            python -m twine upload dist/*
          else
            echo "PYPI_TOKEN not configured — skipping upload (GitHub Release assets published)"
          fi
