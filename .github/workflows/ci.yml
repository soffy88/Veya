name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.1" mypy pytest pytest-asyncio pytest-cov
          pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Ruff lint (core packages)
        run: ruff check veya/ server/ cli/ commands/ tools/ session/ streaming/ hooks/ config/ agents/ registries/ --no-cache

      - name: 3O paradigm checks (附录 B)
        run: |
          python scripts/check_obase_no_reverse_dep.py
          python scripts/check_manifest.py
          python scripts/check_async_contract.py

      - name: 3O SPEC v3.0 Appendix B — 9-check suite (main libraries, report)
        run: python .github/scripts/3o_lint/runner.py --report-only

      - name: G16 English-docstring gate (modern core)
        run: python scripts/check_docstring_language.py

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy pytest-asyncio
          pip install -e ".[dev]"

      - name: Run mypy
        run: |
          mypy --config-file pyproject.toml server/coordinator.py veya/streaming.py veya/sandbox.py veya/intent.py veya/obase/ veya/llm.py veya/errors.py veya/compat.py veya/utils.py
        # G7: 解锁集严格检查(coordinator/streaming/sandbox/intent + obase/llm/errors/compat/utils)。
        # 遗留代码暂不纳入,避免整库历史错误阻塞 CI。

      - name: Run mypy (current chat kernel)
        run: |
          mypy --config-file pyproject.toml --follow-imports=skip server/coordinator_master.py server/tool_registry.py
        # docs/VEYA_10_OF_10_PLAN.md §15.1: 上面那条 G7 检查只查 legacy coordinator.py,
        # 从没查过真正的主链入口 coordinator_master.py/tool_registry.py (2026-08-24 核实:
        # 补全后跟随导入会拉出 384 个历史错误, 跟这两个文件本身无关) —— 单独用
        # --follow-imports=skip 只查这两个文件自身, 不跟随导入闭包, 避免被无关历史债务
        # 挡住。这两个文件本身已清零 (2026-08-24), 新代码不能再往这两个文件里引入新错误。

  docs:
    name: Docs Build (mkdocs)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install docs toolchain
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocstrings[python]

      - name: Build docs (strict)
        run: mkdocs build --strict

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=veya --cov=server --cov=agents --cov=tools \
            --cov-report=xml --cov-report=term-missing --junitxml=junit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: junit.xml

  smoke:
    name: Product Smoke (install → start → task → result)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install as a user would (pip)
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Version & doctor self-check
        run: |
          veya --version | grep -q "0.6.0"
          veya doctor --json | python -c "import json,sys; d=json.load(sys.stdin); print('doctor checks:', len(d['checks']))"

      - name: Dispatch a task headlessly (offline stub mode)
        # `pip install .` 不含 platform/3O/(pyproject.toml wheel exclude, 3O 走独立仓库单一
        # 来源), 所以 Infra.init 里 obase.agent_registry 这类 import 需要 PYTHONPATH 指到
        # checkout 出来的子模块源码 — 跟生产 docker-compose.yml 的 PYTHONPATH 是同一套路径,
        # 不是新发明的临时方案。之前这里靠 `|| true` 掩盖了这个从未真正跑通过的路径
        # (本地复现过: 不设 PYTHONPATH 时是 ModuleNotFoundError, 不是"离线模式无输出")。
        env:
          PYTHONPATH: "platform/3O/oprim:platform/3O/oskill:platform/3O/omodul:platform/3O/obase:platform/3O/oservi"
        run: |
          OUT=$(veya-headless --agent plan --text "做一个 3 步的部署计划" 2>&1)
          RC=$?
          echo "$OUT" | tail -30
          if [ $RC -ne 0 ]; then
            echo "SMOKE FAIL: veya-headless exited $RC"
            exit 1
          fi
          # CI 沙箱没有 ollama/API key, LLM 调用会失败并被 coordinator 兜底成
          # "could not reach ..." 这类可见错误文案(status 仍是 success) —— 这是预期的
          # 离线降级行为, 不是崩溃; 崩溃走上面的 RC 分支硬失败。
          echo "$OUT" | grep -qiE "plan|计划|deploy|部署|could not reach|error" \
            && echo "SMOKE OK: task pipeline produced a structured response" \
            || { echo "SMOKE FAIL: no recognizable output"; exit 1; }

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
