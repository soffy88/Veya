[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hicode"
version = "0.2.0"
description = "hicode — AI coding agent (복제 + opencode/Claude Code 초월)"
requires-python = ">=3.11"
dependencies = ["pygments>=2.0", "anthropic>=0.20.0"]

[project.scripts]
hicode = "hicode_tui.repl:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hicode_tui*"]
